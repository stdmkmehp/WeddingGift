# WeddingGift compose —— 本地容器基线验证用
#
# 仅用于开发机验证镜像可构建、可运行、健康检查通过。
# 与 deploy/compose.yaml 的差异：
#   - 使用 bridge 默认网络，不依赖 costra_default
#   - 用 named volume 代替 /data/wedding 真实目录，避免本机路径依赖
#   - 映射一个本机端口以便浏览器访问（仅本地，生产严禁 ports:）
#
# 用法：docker compose -p wedding-local -f deploy/compose.local.yaml up --build

name: wedding-local

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: wedding-app:local
    container_name: wedding-app-local
    restart: unless-stopped

    ports:
      - "3000:3000"   # 仅本地验证使用；生产环境严禁发布端口

    environment:
      WEDDING_LISTEN_ADDR: ":3000"

    volumes:
      - wedding_data:/data/wedding/data
      - wedding_backups:/data/wedding/backups

    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "/app/wedding", "healthz-check"]
      interval: 10s
      timeout: 5s
      start_period: 3s
      retries: 3

volumes:
  wedding_data:
  wedding_backups:

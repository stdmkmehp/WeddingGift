<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>感谢你来参加婚礼～</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23B99A6A' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='10' r='3.5' fill='%238B5E66'/%3E%3C/svg%3E">
    <!-- 相对路径引用，兼容 /wedding/ 前缀，禁止使用域名根路径 -->
    <link rel="stylesheet" href="assets/app.css">
</head>
<body>
    <!-- 婚礼背景层：帷幕 / 手绘花艺 / 庆祝酒杯 / 心形花环 / 喜字印记 / 花瓣，全部仅装饰，对辅助技术隐藏 -->
    <!-- 「幕启·相见」第二版：以被视口裁切的大比例花艺构图替代零散小图标，让边缘留白成为画面的一部分。 -->
    <div class="bg-veil veil-tl" aria-hidden="true">
        <svg viewBox="0 0 460 330" preserveAspectRatio="none" focusable="false">
            <defs>
                <linearGradient id="veil-tl-main" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.18"/>
                    <stop offset="0.62" stop-color="#A9787F" stop-opacity="0.09"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="veil-tl-fold" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#FFF9F4" stop-opacity="0.32"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#veil-tl-main)"
                  d="M0 0 H460 C400 62 328 122 238 175 C156 223 74 249 0 264 Z"/>
            <path fill="url(#veil-tl-fold)"
                  d="M0 0 H306 C251 52 185 96 104 127 C62 143 26 150 0 154 Z"/>
            <path fill="url(#veil-tl-fold)"
                  d="M0 20 C82 54 135 94 168 140 C106 183 52 205 0 215 Z"/>
        </svg>
    </div>
    <div class="bg-veil veil-tr" aria-hidden="true">
        <svg viewBox="0 0 420 300" preserveAspectRatio="none" focusable="false">
            <defs>
                <linearGradient id="veil-tr-main" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.12"/>
                    <stop offset="0.56" stop-color="#A9787F" stop-opacity="0.06"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="veil-tr-fold" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#FFF9F4" stop-opacity="0.26"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#veil-tr-main)"
                  d="M420 0 H0 C58 61 129 117 218 164 C296 205 364 228 420 240 Z"/>
            <path fill="url(#veil-tr-fold)"
                  d="M420 0 H142 C184 46 246 87 316 110 C358 124 393 129 420 131 Z"/>
        </svg>
    </div>

    <!-- 左上：被裁切的花枝与双朵山茶，作为画面的开场。 -->
    <div class="edge-deco deco-bloom-tl" aria-hidden="true">
        <svg viewBox="0 0 220 248" fill="none" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="botanical-stem" d="M-8 238 C31 213 67 177 89 132 C110 90 143 57 205 20"/>
            <path class="botanical-gold" d="M5 230 C40 207 67 181 86 149"/>
            <path class="leaf-fill leaf-olive" d="M74 165 C46 157 32 136 34 116 C59 120 76 140 74 165 Z"/>
            <path class="leaf-fill leaf-soft" d="M102 118 C96 89 109 67 130 53 C140 78 129 103 102 118 Z"/>
            <path class="leaf-fill leaf-olive" d="M130 81 C147 58 169 52 188 56 C174 78 154 87 130 81 Z"/>
            <g class="blossom" transform="translate(142 77) rotate(16)">
                <path class="flower-petal petal-rose" d="M0 0 C-14 -15 -12 -32 -1 -40 C11 -30 14 -15 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(72)" d="M0 0 C-14 -15 -12 -32 -1 -40 C11 -30 14 -15 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(144)" d="M0 0 C-14 -15 -12 -32 -1 -40 C11 -30 14 -15 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(216)" d="M0 0 C-14 -15 -12 -32 -1 -40 C11 -30 14 -15 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(288)" d="M0 0 C-14 -15 -12 -32 -1 -40 C11 -30 14 -15 0 0 Z"/>
                <circle class="flower-core" r="5"/>
            </g>
            <g class="blossom blossom-small" transform="translate(84 142) rotate(-10)">
                <path class="flower-petal petal-soft" d="M0 0 C-9 -10 -8 -21 -1 -27 C8 -20 10 -10 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(72)" d="M0 0 C-9 -10 -8 -21 -1 -27 C8 -20 10 -10 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(144)" d="M0 0 C-9 -10 -8 -21 -1 -27 C8 -20 10 -10 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(216)" d="M0 0 C-9 -10 -8 -21 -1 -27 C8 -20 10 -10 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(288)" d="M0 0 C-9 -10 -8 -21 -1 -27 C8 -20 10 -10 0 0 Z"/>
                <circle class="flower-core" r="3.3"/>
            </g>
        </svg>
    </div>

    <!-- 右上：一组带香槟弧面的高脚杯，以碰杯动势呼应婚礼庆祝。 -->
    <div class="edge-deco deco-toast-tr" aria-hidden="true">
        <svg viewBox="0 0 190 210" fill="none" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="toast-arc" d="M34 35 C76 11 120 13 164 37"/>
            <g transform="rotate(-12 67 103)">
                <path class="glass-line" d="M35 37 H93 C91 73 82 94 64 103 C46 94 37 73 35 37 Z"/>
                <path class="glass-fill" d="M39 66 H89 C85 83 77 94 64 99 C51 94 43 83 39 66 Z"/>
                <path class="glass-line" d="M64 103 V157"/>
                <path class="glass-line" d="M40 159 H88"/>
            </g>
            <g transform="rotate(12 118 98)">
                <path class="glass-line" d="M91 30 H149 C147 66 138 87 120 96 C102 87 93 66 91 30 Z"/>
                <path class="glass-fill" d="M95 59 H145 C141 76 133 87 120 92 C107 87 99 76 95 59 Z"/>
                <path class="glass-line" d="M120 96 V150"/>
                <path class="glass-line" d="M96 152 H144"/>
            </g>
            <path class="toast-spark" d="M94 22 V7 M87 14 H101 M156 79 V65 M149 72 H163"/>
            <circle class="toast-bubble" cx="157" cy="47" r="3.2"/>
            <circle class="toast-bubble" cx="168" cy="58" r="2"/>
        </svg>
    </div>

    <!-- 右侧：花藤环抱的心形，不使用孤立通用爱心图标。 -->
    <div class="edge-deco deco-heart-r" aria-hidden="true">
        <svg viewBox="0 0 180 210" fill="none" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="heart-line" d="M90 174 C56 149 30 124 30 85 C30 61 47 46 68 46 C79 46 86 52 90 61 C94 52 101 46 112 46 C133 46 150 61 150 85 C150 124 124 149 90 174 Z"/>
            <path class="heart-inner" d="M90 157 C64 136 47 114 47 86 C47 71 56 61 69 61 C79 61 86 67 90 76 C94 67 101 61 111 61 C124 61 133 71 133 86 C133 114 116 136 90 157 Z"/>
            <path class="botanical-gold" d="M22 162 C44 142 51 126 53 107"/>
            <path class="leaf-fill leaf-olive" d="M46 132 C28 132 17 120 14 106 C31 106 43 116 46 132 Z"/>
            <path class="leaf-fill leaf-soft" d="M51 113 C54 95 66 84 79 80 C79 98 69 110 51 113 Z"/>
            <g class="blossom blossom-small" transform="translate(45 145) rotate(20)">
                <path class="flower-petal petal-soft" d="M0 0 C-7 -8 -6 -18 -1 -23 C7 -17 8 -8 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(72)" d="M0 0 C-7 -8 -6 -18 -1 -23 C7 -17 8 -8 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(144)" d="M0 0 C-7 -8 -6 -18 -1 -23 C7 -17 8 -8 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(216)" d="M0 0 C-7 -8 -6 -18 -1 -23 C7 -17 8 -8 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(288)" d="M0 0 C-7 -8 -6 -18 -1 -23 C7 -17 8 -8 0 0 Z"/>
                <circle class="flower-core" r="2.7"/>
            </g>
        </svg>
    </div>

    <!-- 左侧：舒展的大朵花与细长枝干，留出安静的中部阅读区。 -->
    <div class="edge-deco deco-bloom-ml" aria-hidden="true">
        <svg viewBox="0 0 190 232" fill="none" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="botanical-stem" d="M12 228 C36 190 67 159 86 119 C101 87 111 50 119 10"/>
            <path class="botanical-gold" d="M22 219 C55 187 76 158 87 128"/>
            <path class="leaf-fill leaf-olive" d="M68 157 C43 151 28 132 29 111 C52 116 68 133 68 157 Z"/>
            <path class="leaf-fill leaf-soft" d="M91 121 C108 101 131 96 150 102 C135 121 114 127 91 121 Z"/>
            <g class="blossom" transform="translate(111 62) rotate(-9)">
                <path class="flower-petal petal-soft" d="M0 0 C-16 -17 -14 -36 -1 -46 C13 -35 16 -17 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(72)" d="M0 0 C-16 -17 -14 -36 -1 -46 C13 -35 16 -17 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(144)" d="M0 0 C-16 -17 -14 -36 -1 -46 C13 -35 16 -17 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(216)" d="M0 0 C-16 -17 -14 -36 -1 -46 C13 -35 16 -17 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(288)" d="M0 0 C-16 -17 -14 -36 -1 -46 C13 -35 16 -17 0 0 Z"/>
                <circle class="flower-core" r="5.4"/>
            </g>
            <path class="botanical-stem" d="M89 125 C103 137 117 145 139 148"/>
            <circle class="bud-fill" cx="151" cy="150" r="8"/>
        </svg>
    </div>

    <!-- 右下：香槟金枝条与花苞收尾，平衡整页的对角线构图。 -->
    <div class="edge-deco deco-vine-br" aria-hidden="true">
        <svg viewBox="0 0 230 220" fill="none" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="botanical-gold" d="M232 207 C185 191 164 162 144 124 C128 94 96 66 39 21"/>
            <path class="botanical-stem" d="M225 213 C184 193 157 159 139 121"/>
            <path class="leaf-fill leaf-olive" d="M157 152 C178 147 196 157 204 174 C184 177 167 169 157 152 Z"/>
            <path class="leaf-fill leaf-soft" d="M128 105 C104 102 89 88 84 70 C106 69 122 82 128 105 Z"/>
            <path class="leaf-fill leaf-olive" d="M101 76 C111 54 130 43 149 45 C140 66 124 77 101 76 Z"/>
            <g class="blossom blossom-small" transform="translate(75 51) rotate(-16)">
                <path class="flower-petal petal-soft" d="M0 0 C-8 -9 -7 -20 -1 -25 C8 -18 9 -9 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(72)" d="M0 0 C-8 -9 -7 -20 -1 -25 C8 -18 9 -9 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(144)" d="M0 0 C-8 -9 -7 -20 -1 -25 C8 -18 9 -9 0 0 Z"/>
                <path class="flower-petal petal-rose" transform="rotate(216)" d="M0 0 C-8 -9 -7 -20 -1 -25 C8 -18 9 -9 0 0 Z"/>
                <path class="flower-petal petal-soft" transform="rotate(288)" d="M0 0 C-8 -9 -7 -20 -1 -25 C8 -18 9 -9 0 0 Z"/>
                <circle class="flower-core" r="3"/>
            </g>
            <circle class="bud-fill" cx="43" cy="24" r="7.4"/>
        </svg>
    </div>

    <!-- 以半透明印章形式保留「喜」字，避免成为孤立的文字装饰。 -->
    <div class="xi-mark" aria-hidden="true">喜</div>

    <!-- 慢速坠落花瓣：使用带双瓣凹口、内侧高光与叶脉的 SVG，而非圆角色块；全局显示。 -->
    <div class="petals" aria-hidden="true">
        <span class="petal"><svg viewBox="0 0 40 52" focusable="false"><path class="petal-body" d="M20 48 C13 43 5 35 6 23 C7 12 12 5 17 5 C18.8 5 19.7 6.5 20 8 C20.3 6.5 21.2 5 23 5 C28 5 33 12 34 23 C35 35 27 43 20 48 Z"/><path class="petal-highlight" d="M20 43 C17 35 17 23 20 11 C23 23 23 35 20 43 Z"/><path class="petal-vein" d="M20 43 C20 33 20 22 20 11"/></svg></span>
        <span class="petal"><svg viewBox="0 0 40 52" focusable="false"><path class="petal-body" d="M20 48 C13 43 5 35 6 23 C7 12 12 5 17 5 C18.8 5 19.7 6.5 20 8 C20.3 6.5 21.2 5 23 5 C28 5 33 12 34 23 C35 35 27 43 20 48 Z"/><path class="petal-highlight" d="M20 43 C17 35 17 23 20 11 C23 23 23 35 20 43 Z"/><path class="petal-vein" d="M20 43 C20 33 20 22 20 11"/></svg></span>
        <span class="petal"><svg viewBox="0 0 40 52" focusable="false"><path class="petal-body" d="M20 48 C13 43 5 35 6 23 C7 12 12 5 17 5 C18.8 5 19.7 6.5 20 8 C20.3 6.5 21.2 5 23 5 C28 5 33 12 34 23 C35 35 27 43 20 48 Z"/><path class="petal-highlight" d="M20 43 C17 35 17 23 20 11 C23 23 23 35 20 43 Z"/><path class="petal-vein" d="M20 43 C20 33 20 22 20 11"/></svg></span>
        <span class="petal"><svg viewBox="0 0 40 52" focusable="false"><path class="petal-body" d="M20 48 C13 43 5 35 6 23 C7 12 12 5 17 5 C18.8 5 19.7 6.5 20 8 C20.3 6.5 21.2 5 23 5 C28 5 33 12 34 23 C35 35 27 43 20 48 Z"/><path class="petal-highlight" d="M20 43 C17 35 17 23 20 11 C23 23 23 35 20 43 Z"/><path class="petal-vein" d="M20 43 C20 33 20 22 20 11"/></svg></span>
        <span class="petal"><svg viewBox="0 0 40 52" focusable="false"><path class="petal-body" d="M20 48 C13 43 5 35 6 23 C7 12 12 5 17 5 C18.8 5 19.7 6.5 20 8 C20.3 6.5 21.2 5 23 5 C28 5 33 12 34 23 C35 35 27 43 20 48 Z"/><path class="petal-highlight" d="M20 43 C17 35 17 23 20 11 C23 23 23 35 20 43 Z"/><path class="petal-vein" d="M20 43 C20 33 20 22 20 11"/></svg></span>
    </div>

    <main class="app" role="main">
        <!-- 登录态主标题：仅登录时显示，作为页面顶部首行（位于 site-header 之上） -->
        <h1 class="home-intro" id="home-intro" hidden>感谢你来见证我们的幸福时刻</h1>

        <header class="site-header" id="site-header">
            <p class="couple" id="couple-names">赵伟 &amp; 刘子璇</p>
            <p class="date" id="wedding-date">2026-09-26</p>
        </header>

        <!-- 初始化加载态：不闪现任何礼品信息 -->
        <section id="view-loading" class="view" aria-live="polite">
            <p class="loading-text">正在打开这封感谢信…</p>
        </section>

        <!-- 登录态 -->
        <section id="view-login" class="view" hidden>
            <form id="login-form" class="card" novalidate>
                <div class="field">
                    <label for="login-name">你的名字</label>
                    <input id="login-name" name="loginName" type="text" autocomplete="name"
                           required maxlength="64">
                </div>
                <div class="field">
                    <label for="login-key">8 位卡片密钥</label>
                    <input id="login-key" name="keyCode" type="text" inputmode="numeric"
                           autocomplete="off" required maxlength="8"
                           aria-describedby="login-hint">
                </div>
                <p class="hint" id="login-hint">请输入你的名字，以及卡片上的 8 位数字</p>
                <p class="form-error" id="login-error" role="alert" hidden></p>
                <button type="submit" class="btn btn-primary" id="login-submit">查看礼物</button>
            </form>
        </section>

        <!-- 同行组欢迎与多礼品态 -->
        <section id="view-gifts" class="view" hidden>
            <h1 class="salutation" id="salutation"></h1>
            <p class="thanks" id="thanks-message"></p>
            <p class="custom-message" id="custom-message" hidden></p>
            <!-- 感谢信落款：新人署名居右，婚期紧随其后 -->
            <div class="signature">
                <p class="signature-names" id="signature-names"></p>
                <p class="signature-date" id="signature-date"></p>
            </div>
            <p class="gift-count" id="gift-count"></p>
            <ul class="gift-list" id="gift-list"></ul>
            <button type="button" class="btn btn-ghost" id="logout-btn">退出登录</button>
        </section>

        <!-- 服务异常态（维护/到期/初始化失败） -->
        <section id="view-error" class="view" hidden>
            <h1>页面暂时不可用</h1>
            <p id="error-text">页面维护中，请稍后再试。</p>
            <button type="button" class="btn btn-primary" id="error-retry">重新加载</button>
        </section>
    </main>

    <footer class="site-footer">
        <p id="privacy-note">本页仅用于展示回礼，我们只收集识别所需的信息，活动结束后删除。</p>
        <p id="contact-hint">如有疑问，请咨询赵伟/刘子璇。</p>
        <p><a id="icp-link" href="https://beian.miit.gov.cn/" target="_blank"
              rel="noopener noreferrer">沪ICP备2026017253号-2</a></p>
    </footer>

    <noscript><p class="noscript">本页面需要启用 JavaScript 才能查看礼物。</p></noscript>
    <!-- 相对路径引用，禁止使用域名根路径 -->
    <script src="assets/app.js" type="module"></script>
</body>
</html>

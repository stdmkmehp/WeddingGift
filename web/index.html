<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>感谢你来参加婚礼～</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23B99A6A' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='10' r='3.5' fill='%238B5E66'/%3E%3C/svg%3E">
    <!-- 相对路径引用，兼容 /wedding/ 前缀，禁止使用域名根路径 -->
    <link rel="stylesheet" href="assets/app.css">
</head>
<body>
    <!-- 婚礼背景层：帷幕 / 边缘细线稿 / 喜字水印 / 花瓣，全部仅装饰，对辅助技术隐藏 -->
    <!-- 帷幕：左上 15% / 右上 8% 灰粉酒红曲面，各自由双层错位曲面叠加出轻薄布料折光 -->
    <div class="bg-veil veil-tl" aria-hidden="true">
        <svg viewBox="0 0 420 300" preserveAspectRatio="none" focusable="false">
            <defs>
                <linearGradient id="veil-tl-main" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.15"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="veil-tl-fold" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.08"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#veil-tl-main)"
                  d="M0 0 H420 C342 92 252 176 152 214 C96 234 40 244 0 252 Z"/>
            <path fill="url(#veil-tl-fold)"
                  d="M0 0 H288 C236 56 172 102 102 122 C62 133 24 140 0 146 Z"/>
        </svg>
    </div>
    <div class="bg-veil veil-tr" aria-hidden="true">
        <svg viewBox="0 0 420 300" preserveAspectRatio="none" focusable="false">
            <defs>
                <linearGradient id="veil-tr-main" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.08"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="veil-tr-fold" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#8B5E66" stop-opacity="0.05"/>
                    <stop offset="1" stop-color="#8B5E66" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <path fill="url(#veil-tr-main)"
                  d="M420 0 H0 C78 92 168 176 268 214 C324 234 380 244 420 252 Z"/>
            <path fill="url(#veil-tr-fold)"
                  d="M420 0 H132 C184 56 248 102 318 122 C358 133 396 140 420 146 Z"/>
        </svg>
    </div>
    <!-- 边缘细线稿 5 处：细枝 / 碰杯 / 独立爱心 / 单朵小花 / 细枝局部；
         0.25–0.35pt 质感细描边，香槟金仅作断续短线（.dash），酒红小面积点缀（.accent） -->
    <div class="edge-deco deco-branch-tl" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="0.5"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="dash" d="M9 41 C15 31 21 21 33 10"/>
            <path class="accent" d="M20 26 q-6 -0.5 -7.5 -6.5 q6 0.5 7.5 6.5 Z"/>
            <g class="accent" transform="translate(34 9)">
                <circle cx="0" cy="-3.1" r="1.7"/>
                <circle cx="2.95" cy="-0.95" r="1.7"/>
                <circle cx="1.8" cy="2.5" r="1.7"/>
                <circle cx="-1.8" cy="2.5" r="1.7"/>
                <circle cx="-2.95" cy="-0.95" r="1.7"/>
                <circle cx="0" cy="0" r="0.9" fill="currentColor" stroke="none"/>
            </g>
        </svg>
    </div>
    <div class="edge-deco deco-glass-tr" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="0.55"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <g transform="rotate(-12 17 20)">
                <path d="M11 9 h12 v7.5 a6 6 0 0 1 -12 0 Z"/>
                <path d="M17 22.5 v9.5"/>
                <path d="M12.5 32 h9"/>
            </g>
            <g transform="rotate(12 31 20)">
                <path d="M25 9 h12 v7.5 a6 6 0 0 1 -12 0 Z"/>
                <path d="M31 22.5 v9.5"/>
                <path d="M26.5 32 h9"/>
            </g>
        </svg>
    </div>
    <div class="edge-deco deco-heart-r" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="0.5"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M24 36 C21.5 33.8 11 26 11 19.4 C11 15.3 14.2 12 18.2 12
                     C20.4 12 22.2 13 24 14.8 C25.8 13 27.6 12 29.8 12
                     C33.8 12 37 15.3 37 19.4 C37 26 26.5 33.8 24 36 Z"/>
        </svg>
    </div>
    <div class="edge-deco deco-flower-l" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="0.5"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M24 44 C23 37 23.5 30 24 24"/>
            <path d="M23.5 33 q-5.5 -0.5 -6.5 -5.5 q5.5 0.5 6.5 5.5 Z"/>
            <g transform="translate(24 17)">
                <circle cx="0" cy="-4" r="2.1"/>
                <circle cx="3.8" cy="-1.2" r="2.1"/>
                <circle cx="2.35" cy="3.3" r="2.1"/>
                <circle cx="-2.35" cy="3.3" r="2.1"/>
                <circle cx="-3.8" cy="-1.2" r="2.1"/>
                <circle cx="0" cy="0" r="1" fill="currentColor" stroke="none"/>
            </g>
        </svg>
    </div>
    <div class="edge-deco deco-twig-br" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="0.5"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path class="dash" d="M39 42 C33 33 27 25 15 14"/>
            <path class="accent" d="M24 24 q5.5 -0.5 6.5 -5.5 q-5.5 0.5 -6.5 5.5 Z"/>
        </svg>
    </div>
    <!-- 极淡单字「喜」水印：左侧中下，小尺寸、低透明，不使用居中大红囍字 -->
    <div class="xi-mark" aria-hidden="true">喜</div>
    <!-- 慢速坠落花瓣：全局显示（登录页与登录后页面均有），prefers-reduced-motion 时静止不可见 -->
    <div class="petals" aria-hidden="true">
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
    </div>

    <main class="app" role="main">
        <!-- 登录态主标题：仅登录时显示，作为页面顶部首行（位于 site-header 之上） -->
        <h1 class="home-intro" id="home-intro" hidden>感谢你来见证我们的幸福时刻</h1>

        <header class="site-header" id="site-header">
            <p class="couple" id="couple-names">赵伟 &amp; 刘子璇</p>
            <p class="date" id="wedding-date">2026-09-26</p>
        </header>

        <!-- 初始化加载态：不闪现任何礼品信息 -->
        <section id="view-loading" class="view" aria-live="polite">
            <p class="loading-text">正在打开这封感谢信…</p>
        </section>

        <!-- 登录态 -->
        <section id="view-login" class="view" hidden>
            <form id="login-form" class="card" novalidate>
                <div class="field">
                    <label for="login-name">你的名字</label>
                    <input id="login-name" name="loginName" type="text" autocomplete="name"
                           required maxlength="64">
                </div>
                <div class="field">
                    <label for="login-key">8 位卡片密钥</label>
                    <input id="login-key" name="keyCode" type="text" inputmode="numeric"
                           autocomplete="off" required maxlength="8"
                           aria-describedby="login-hint">
                </div>
                <p class="hint" id="login-hint">请输入你的名字，以及卡片上的 8 位数字</p>
                <p class="form-error" id="login-error" role="alert" hidden></p>
                <button type="submit" class="btn btn-primary" id="login-submit">查看礼物</button>
            </form>
        </section>

        <!-- 同行组欢迎与多礼品态 -->
        <section id="view-gifts" class="view" hidden>
            <h1 class="salutation" id="salutation"></h1>
            <p class="thanks" id="thanks-message"></p>
            <p class="custom-message" id="custom-message" hidden></p>
            <!-- 感谢信落款：新人署名居右，婚期紧随其后 -->
            <div class="signature">
                <p class="signature-names" id="signature-names"></p>
                <p class="signature-date" id="signature-date"></p>
            </div>
            <p class="gift-count" id="gift-count"></p>
            <ul class="gift-list" id="gift-list"></ul>
            <button type="button" class="btn btn-ghost" id="logout-btn">退出登录</button>
        </section>

        <!-- 服务异常态（维护/到期/初始化失败） -->
        <section id="view-error" class="view" hidden>
            <h1>页面暂时不可用</h1>
            <p id="error-text">页面维护中，请稍后再试。</p>
            <button type="button" class="btn btn-primary" id="error-retry">重新加载</button>
        </section>
    </main>

    <footer class="site-footer">
        <p id="privacy-note">本页仅用于展示回礼，我们只收集识别所需的信息，活动结束后删除。</p>
        <p id="contact-hint">如有疑问，请咨询赵伟/刘子璇。</p>
        <p><a id="icp-link" href="https://beian.miit.gov.cn/" target="_blank"
              rel="noopener noreferrer">沪ICP备2026017253号-2</a></p>
    </footer>

    <noscript><p class="noscript">本页面需要启用 JavaScript 才能查看礼物。</p></noscript>
    <!-- 相对路径引用，禁止使用域名根路径 -->
    <script src="assets/app.js" type="module"></script>
</body>
</html>
